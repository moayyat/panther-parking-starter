<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Panther Parking{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 0 16px; color: #1d1d1f; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #4b2e83; padding: 12px 0; }
    header a { color: #4b2e83; margin-left: 12px; }
    .flash { background: #fff4d6; border: 1px solid #e6c36a; padding: 8px 12px; margin: 12px 0; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    .open { color: #1a7f37; } .filling { color: #9a6700; } .full { color: #cf222e; font-weight: 600; }
    form label { display: block; margin-top: 12px; }
    input { padding: 6px; width: 280px; }
    button { margin-top: 16px; padding: 8px 16px; background: #4b2e83; color: #fff; border: 0; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <strong>Panther Parking</strong>
    <nav>
      <a href="{{ url_for('lots.index') }}">Lots</a>
      {% if g.user %}
        <span>{{ g.user['email'] }}</span> <a href="{{ url_for('auth.logout') }}">Log out</a>
      {% else %}
        <a href="{{ url_for('auth.register') }}">Register</a> <a href="{{ url_for('auth.login') }}">Log in</a>
      {% endif %}
    </nav>
  </header>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
